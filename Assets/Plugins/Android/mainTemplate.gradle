apply plugin: 'com.android.library'
apply from: '../shared/keepUnitySymbols.gradle'
apply from: '../shared/common.gradle'
**APPLY_PLUGINS**

dependencies {
    // shotfield-* 两个 jar 是 source-java 下同名 .java 的编译产物；源码已由 Unity 编入
    // unityLibrary，再打包 jar 会在 mergeDexRelease 阶段报同类重复定义。这里只排除重复产物，
    // jar 文件保留在 libs 不入包；如改回 jar 形态，需先删掉 source-java 对应源码，避免双向重复。
    implementation fileTree(dir: 'libs', include: ['*.jar'], exclude: ['shotfield-script-picker.jar', 'shotfield-video-encoder.jar'])
**DEPS**}

android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"
    compileSdk **APIVERSION**
    buildToolsVersion "**BUILDTOOLS**"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
**DEFAULT_CONFIG_SETUP**
    }

    lint {
        abortOnError false
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }
    packaging {
        // PICO SDK (LoaderForUnitySDK) 与 Unity OpenXR 插件 (openxr_loader)
        // 各自携带同名 libopenxr_loader.so，Gradle 合并 native 库时会报
        // "2 files found with path 'lib/arm64-v8a/libopenxr_loader.so'"。
        // 保留一份即可，两者都是标准 Khronos OpenXR loader。
        pickFirst 'lib/arm64-v8a/libopenxr_loader.so'
        pickFirst 'lib/armeabi-v7a/libopenxr_loader.so'
    }
**PACKAGING**
}
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
